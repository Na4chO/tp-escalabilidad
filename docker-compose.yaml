services:
  server:
    build:
      context: ./src
      dockerfile: article_processing_system/server/Dockerfile
    container_name: server
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5678
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - BATCH_SIZE=100
      - SERVER_ID=1
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q :5678"]
      interval: 2s
      timeout: 2s
      retries: 30

  metadata_filter_0:
    build:
      context: ./src
      dockerfile: article_processing_system/metadata_filter/Dockerfile
    container_name: metadata_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - BATCH_SIZE=100
      - INSTANCE_ID=0
      - IMAGE_FETCHER_COUNT=2

  metadata_filter_1:
    build:
      context: ./src
      dockerfile: article_processing_system/metadata_filter/Dockerfile
    container_name: metadata_filter_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - BATCH_SIZE=100
      - INSTANCE_ID=1
      - IMAGE_FETCHER_COUNT=2

  metadata_filter_2:
    build:
      context: ./src
      dockerfile: article_processing_system/metadata_filter/Dockerfile
    container_name: metadata_filter_2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - BATCH_SIZE=100
      - INSTANCE_ID=2
      - IMAGE_FETCHER_COUNT=2

  image_fetcher_0:
    build:
      context: ./src
      dockerfile: article_processing_system/image_fetcher/Dockerfile
    container_name: image_fetcher_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - BATCH_SIZE=100
      - WIKIMEDIA_USER_AGENT=SistemasDistribuidos-Grupo29/1.0 (https://github.com/Na4chO/tp-escalabilidad)
      - IMAGE_CACHE_SIZE=100
      - PARTITION=0
      - DOWNLOAD_RATE_MBPS=25

  image_fetcher_1:
    build:
      context: ./src
      dockerfile: article_processing_system/image_fetcher/Dockerfile
    container_name: image_fetcher_1
