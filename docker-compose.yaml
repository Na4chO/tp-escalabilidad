services:
  server:
    build:
      context: ./src
      dockerfile: server/Dockerfile
    container_name: server
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5678
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
    ports:
      - "5678:5678"

  metadata_filter:
    build:
      context: ./src
      dockerfile: metadata_filter/Dockerfile
    container_name: metadata_filter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
    ports:
      - "5678:5678"

  image_fetcher:
    build:
      context: ./src
      dockerfile: image_fetcher/Dockerfile
    container_name: image_fetcher
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672
      - WIKIMEDIA_USER_AGENT=SistemasDistribuidos-Grupo29/1.0
    ports:
      - "5678:5678"

  frequency_collector:
    build:
      context: ./src
      dockerfile: frequency_collector/Dockerfile
    container_name: frequency_collector
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - TOP_SIZE=5
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672

  top_aggregator:
    build:
      context: ./src
      dockerfile: top_aggregator/Dockerfile
    container_name: top_aggregator
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - TOP_SIZE=5
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672

  client_0:
    build:
      context: ./src
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
      - server
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678

  abstract_word_counter:
    build:
      context: ./src
      dockerfile: abstract_word_counter/Dockerfile
    container_name: abstract_word_counter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672

  average_calculator:
    build:
      context: ./src
      dockerfile: average_calculator/Dockerfile
    container_name: average_calculator
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - MOM_HOST=rabbitmq
      - MOM_PORT=5672

  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
      - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - 5672:5672
      - 15672:15672